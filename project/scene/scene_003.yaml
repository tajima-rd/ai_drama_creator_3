scene_id: "scene_003"
title: "Slipping on the Snowy Road"
transcripts:
  - actor_name: "Yachiyo"
    context: "Walking along a snow-covered path, daytime."
    scene: "Yachiyo is laughing heartily while walking next to Kiichi."
    directors_note:
      style: "Cheerful, laughing, and highly amused tone"
      pace: "Moderate"
    text: "[laughs] あはは！さっきのキタさんの滑り方、何回思い出しても面白すぎて本当に[giggles] お腹痛いんだけど！"
    order: 1

  - actor_name: "Kiichi"
    context: "Walking along a snow-covered path, daytime."
    scene: "Kiichi sighs and looks at Yachiyo with a calm, slightly exasperated expression."
    directors_note:
      style: "Calm, deadpan, and slightly exasperated tone"
      pace: "Moderate"
    text: "[sighs] キミは他人の失敗を笑いすぎだ。[serious] 少し調子に乗りすぎではないか？"
    order: 2

  - actor_name: "Yachiyo"
    context: "Walking along a snow-covered path, daytime."
    scene: "Yachiyo gestures dramatically, loses her footing on the slippery snow, and begins to fall."
    directors_note:
      style: "Playful at first, then suddenly startled and panicking"
      pace: "Fast"
    text: "[giggles] だって本当にコントみたいだったんだもん！あ、ちょっと足元が滑っ……[gasp] うわあああっ！？"
    order: 3

  - actor_name: "Kiichi"
    context: "Yachiyo is face-down in the snow."
    scene: "Kiichi stops walking and looks down at Yachiyo with a dry, unsympathetic stare."
    directors_note:
      style: "Sarcastic, deadpan, and cold tone"
      pace: "Slow"
    text: "[sarcastic] ……完全に自業自得だろう。"
    order: 4

  - actor_name: "Yachiyo"
    context: "Yachiyo is struggling in the snowdrift."
    scene: "Yachiyo shivers and looks up at Kiichi, pleading for help."
    directors_note:
      style: "Shivering, complaining, and panicking tone"
      pace: "Fast"
    text: "[trembling] 冷たっ！雪の中に完全に突っ込んじゃったじゃん！[panicked] ねえキタさん、冷たい目で見ないで早く助けてよ！"
    order: 5

  - actor_name: "Kiichi"
    context: "Yachiyo is still in the snow."
    scene: "Kiichi stands firmly and lectures Yachiyo with an analytical, indifferent look."
    directors_note:
      style: "Analytical, indifferent, and lecturing tone"
      pace: "Moderate"
    text: "[serious] 助ける必要性を感じない。これは重力加速度と路面状態の予測を怠った結果だ。[sarcastic] キミの方こそ、足元への注意力が散漫すぎるのではないか？"
    order: 6

  - actor_name: "Yachiyo"
    context: "Yachiyo is sitting in the snow, watching Kiichi start to walk away."
    scene: "Yachiyo pouts and whines as Kiichi begins to walk past her."
    directors_note:
      style: "Whining, dejected, and protesting tone"
      pace: "Moderate"
    text: "[crying] うう、そんな淡々と指摘されると深くへこむんだけど……。[shouting] 何も私を置いて、そのまま先へ歩を進めなくてもいいじゃん！"
    order: 7

  - actor_name: "Kiichi"
    context: "Kiichi is walking away from Yachiyo."
    scene: "Kiichi continues walking forward without looking back."
    directors_note:
      style: "Cold, dismissive, yet slightly warning tone"
      pace: "Moderate"
    text: "[sighs] 時間の無駄だ。私は先に行く。[serious] キミも早く立ち上がった方がいいだろうな。"
    order: 8
